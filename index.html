<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yana Kim — Portfolio</title>
<meta name="description" content="Portfolio of Yana Kim, 2026.">
<style>
  :root {
    --bg: #f3f3f2;
    --ink: #262626;
    --muted: #9a9a98;
    --page-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 30px rgba(0,0,0,.07);
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }

  .stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .bookwrap { flex: none; transition: transform .6s cubic-bezier(.3,.7,.2,1); }
  .bookwrap.closed-front { transform: translateX(-25%); }
  .bookwrap.closed-back  { transform: translateX(25%); }

  .page { background: #fff; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .page img {
    display: block; width: 100%; height: 100%;
    object-fit: cover;
    user-select: none; -webkit-user-drag: none; pointer-events: none;
  }
  /* thin light-grey line where the two pages meet */
  .page::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 1px;
    pointer-events: none;
  }
  .page.is-left::after { right: 0; background: rgba(0,0,0,.15); }  /* translucent, so it reads as grey over images too */
  .page.is-right::after { display: none; }
  .page.is-cover::after, .portrait .page::after { display: none; }
  /* one soft shadow under the whole book that follows the turning page, instead of per-page shadows */
  .stf__block { filter: drop-shadow(0 6px 18px rgba(0,0,0,.07)); }

  .nav {
    position: fixed; top: 50%; transform: translateY(-50%);
    width: 56px; height: 96px;
    border: 0; background: none; color: var(--ink);
    cursor: pointer; opacity: .35;
    transition: opacity .2s;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .nav:hover { opacity: .9; }
  .nav:focus-visible { outline: 1px solid var(--ink); outline-offset: -8px; opacity: .9; }
  .nav[disabled] { opacity: 0; pointer-events: none; }
  .nav.prev { left: max(8px, env(safe-area-inset-left, 0px)); }
  .nav.next { right: max(8px, env(safe-area-inset-right, 0px)); }
  .nav svg { width: 18px; height: 34px; }

  .bar {
    flex: none;
    margin-top: 22px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 300;
    font-size: 13px; letter-spacing: .01em;
    color: var(--ink);
  }
  .track {
    position: relative; height: 18px; cursor: pointer;
    touch-action: none;
  }
  .track::before {
    content: ""; position: absolute; left: 0; right: 0; top: 50%;
    height: 1px; background: #cfcfcd;
  }
  .track .fill {
    position: absolute; left: 0; top: 50%; height: 1px;
    background: var(--ink); width: 0;
  }
  .track .dot {
    position: absolute; top: 50%; left: 0;
    width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;
    border-radius: 50%; background: var(--ink);
    transition: transform .15s;
  }
  .track:hover .dot, .track.dragging .dot { transform: scale(1.35); }
  .track:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
  .meta {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    margin-top: 4px;
  }
  .right { justify-self: end; display: flex; align-items: center; gap: 12px; }
  .fs {
    width: 24px; height: 24px; padding: 0; margin-right: -4px;
    border: 0; background: none; color: #000; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .fs:hover { opacity: .6; }
  .fs:focus-visible { outline: 1px solid #000; }
  .fs svg { width: 15px; height: 15px; }
  .fs .exit, .is-fullscreen .fs .enter { display: none; }
  .is-fullscreen .fs .exit { display: block; }

  /* ---- zoom ---- */
  .viewport { position: relative; flex: none; }
  .zoomlayer {
    transform-origin: 50% 50%;
    transition: transform .5s cubic-bezier(.45, 0, .25, 1);   /* slow, smooth glide */
  }
  .zoomlayer.instant { transition: none; }   /* dragging, pinching, sliding follow the hand directly */
  .viewport.zoomed { overflow: hidden; }
  .panlayer {
    position: absolute; inset: 0; z-index: 20;
    display: none; cursor: grab; touch-action: none;
  }
  .viewport.zoomed .panlayer { display: block; }
  .panlayer.panning { cursor: grabbing; }
  .zoom { display: flex; align-items: center; gap: 6px; }
  .zoom button {
    width: 24px; height: 24px; padding: 0; border: 0; background: none;
    color: var(--ink); cursor: pointer; opacity: .55;
    display: flex; align-items: center; justify-content: center;
  }
  .zoom button:hover { opacity: 1; }
  .zoom button[disabled] { opacity: .2; cursor: default; }
  .zoom button:focus-visible { outline: 1px solid var(--ink); }
  .zoom svg { width: 11px; height: 11px; }
  .zoom input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 96px; height: 18px; margin: 0; background: none; cursor: pointer;
  }
  .zoom input[type=range]::-webkit-slider-runnable-track { height: 1px; background: #cfcfcd; }
  .zoom input[type=range]::-moz-range-track { height: 1px; background: #cfcfcd; }
  .zoom input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 9px; height: 9px; margin-top: -4px;
    border: 0; border-radius: 50%; background: var(--ink);
  }
  .zoom input[type=range]::-moz-range-thumb {
    width: 9px; height: 9px; border: 0; border-radius: 50%; background: var(--ink);
  }
  .zoom input[type=range]:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
  .count { font-variant-numeric: tabular-nums; }

  @media (max-height: 500px) { .bar { margin-top: 10px; } }
  @media (max-width: 600px) {
    .nav { display: none; }   /* on phones, swipe or tap the page edges to turn */
    .bar { font-size: 12px; margin-top: 16px; }
    .zoom input[type=range] { width: 56px; }
    .zoom { gap: 2px; }
  }
  @media (prefers-reduced-motion: reduce) { .nav, .bookwrap, .zoomlayer { transition: none; } }
</style>
</head>
<body>
  <main class="stage" aria-label="Yana Kim portfolio">
    <div class="viewport">
      <div class="zoomlayer">
        <div class="bookwrap"><div id="book"></div></div>
      </div>
      <div class="panlayer" aria-hidden="true"></div>
    </div>
    <div class="bar">
      <div class="track" role="slider" tabindex="0" aria-label="Page" aria-valuemin="1">
        <div class="fill"></div><div class="dot"></div>
      </div>
      <div class="meta">
        <span class="count" aria-live="polite"></span>
        <div class="zoom">
          <button class="zoom-out" aria-label="Zoom out" disabled>
            <svg viewBox="0 0 11 11" stroke="currentColor" stroke-width="1.1"><path d="M0 5.5h11"/></svg>
          </button>
          <input class="zoom-range" type="range" min="1" max="3" step="0.01" value="1" aria-label="Zoom">
          <button class="zoom-in" aria-label="Zoom in">
            <svg viewBox="0 0 11 11" stroke="currentColor" stroke-width="1.1"><path d="M0 5.5h11M5.5 0v11"/></svg>
          </button>
        </div>
        <div class="right">
          <span class="sig">Yana Kim. 2026</span>
          <button class="fs" aria-label="Full screen" hidden>
            <svg class="enter" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 1.5h4.5V6M14.5 1.5 9.5 6.5M6 14.5H1.5V10M1.5 14.5l5-5M1.5 6V1.5H6M1.5 1.5l5 5M14.5 10v4.5H10M14.5 14.5l-5-5"/>
            </svg>
            <svg class="exit" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.5 2.5v4h4M9.5 6.5l5-5M6.5 13.5v-4h-4M6.5 9.5l-5 5M2.5 6.5h4v-4M6.5 6.5l-5-5M13.5 9.5h-4v4M9.5 9.5l5 5"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <button class="nav prev" aria-label="Previous page" disabled>
    <svg viewBox="0 0 18 34" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M16 1 2 17l14 16"/></svg>
  </button>
  <button class="nav next" aria-label="Next page">
    <svg viewBox="0 0 18 34" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 1l14 16L2 33"/></svg>
  </button>


<script src="page-flip.browser.js"></script>
<script>
(function () {
  // ---- Settings: change PAGE_COUNT if your portfolio's page count changes ----
  var PAGE_COUNT = 56;
  var PAGE_W = 612, PAGE_H = 792;        // page proportions (US Letter)
  var MIN_W = 100;                        // smallest page width; the book always shows two-page spreads

  var src = function (i) { return "page-" + String(i + 1).padStart(2, "0") + ".jpg"; };
  var book = document.getElementById("book");
  var wrap = book.parentNode;
  var bar = document.querySelector(".bar");
  var ratio = PAGE_W / PAGE_H;

  // Build pages
  for (var i = 0; i < PAGE_COUNT; i++) {
    var p = document.createElement("div");
    var side = i === 0 || i === PAGE_COUNT - 1 ? "is-cover" : (i % 2 ? "is-left" : "is-right");
    p.className = "page " + side;
    p.dataset.density = "hard";   // rigid sheet that rotates over the spine
    var img = document.createElement("img");
    img.alt = "Page " + (i + 1);
    img.dataset.src = src(i);
    img.decoding = "async";
    p.appendChild(img);
    book.appendChild(p);
  }
  var imgs = book.querySelectorAll("img");

  // Load only the pages near where the reader is
  function loadAround(idx) {
    for (var j = Math.max(0, idx - 4); j <= Math.min(PAGE_COUNT - 1, idx + 8); j++) {
      if (!imgs[j].src) imgs[j].src = imgs[j].dataset.src;
    }
  }

  // Size the book to fit the window
  function fit() {
    var small = window.innerWidth < 600;
    var w = window.innerWidth - (small ? 24 : 160);   // phones: no side arrows, so use nearly the full width
    var h = window.innerHeight - (window.innerHeight < 500 ? 70 : small ? 120 : 150);  // short screens (phone sideways) get a bigger book
    var width = Math.max(MIN_W * 2, Math.min(w, h * ratio * 2));
    wrap.style.width = Math.floor(width) + "px";
    bar.style.width = Math.floor(width) + "px";
  }
  fit();

  var flip = new St.PageFlip(book, {
    width: PAGE_W, height: PAGE_H,
    size: "stretch",
    minWidth: MIN_W, maxWidth: 2000,
    minHeight: MIN_W / ratio, maxHeight: 2000 / ratio,
    showCover: true,
    usePortrait: false,
    drawShadow: false,
    maxShadowOpacity: 0,
    flippingTime: 400,
    mobileScrollSupport: false,
    autoSize: true
  });
  flip.loadFromHTML(book.querySelectorAll(".page"));

  var prev = document.querySelector(".nav.prev");
  var next = document.querySelector(".nav.next");
  var count = document.querySelector(".count");

  // ---- page number + scrubber ----
  var track = document.querySelector(".track");
  var dot = track.querySelector(".dot");
  var fill = track.querySelector(".fill");
  track.setAttribute("aria-valuemax", PAGE_COUNT);

  function label(idx, portrait) {
    if (portrait || idx === 0 || idx >= PAGE_COUNT - 1) return String(idx + 1);
    var l = idx % 2 ? idx : idx - 1;                // left page of the spread
    return (l + 1) + "-" + Math.min(l + 2, PAGE_COUNT);
  }
  function showPosition(idx, portrait) {
    var t = label(idx, portrait);
    count.textContent = t + " / " + PAGE_COUNT;
    track.setAttribute("aria-valuenow", idx + 1);
    track.setAttribute("aria-valuetext", "Page " + t + " of " + PAGE_COUNT);
    var pct = (idx / (PAGE_COUNT - 1)) * 100;
    dot.style.left = pct + "%";
    fill.style.width = pct + "%";
  }
  function indexAt(clientX) {
    var r = track.getBoundingClientRect();
    var f = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    return Math.round(f * (PAGE_COUNT - 1));
  }
  function goTo(idx) {
    var cur = flip.getCurrentPageIndex();
    if (idx === cur) return;
    loadAround(idx);
    if (Math.abs(idx - cur) <= 2) flip.flip(idx);
    else { flip.turnToPage(idx); update(idx); }
  }
  var dragging = false;
  track.addEventListener("pointerdown", function (e) {
    dragging = true; track.classList.add("dragging");
    track.setPointerCapture(e.pointerId);
    showPosition(indexAt(e.clientX), flip.getOrientation() === "portrait");
  });
  track.addEventListener("pointermove", function (e) {
    if (dragging) showPosition(indexAt(e.clientX), flip.getOrientation() === "portrait");
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false; track.classList.remove("dragging");
    goTo(indexAt(e.clientX));
  }
  track.addEventListener("pointerup", endDrag);
  track.addEventListener("pointercancel", function () {
    dragging = false; track.classList.remove("dragging");
    update(flip.getCurrentPageIndex());
  });
  track.addEventListener("keydown", function (e) {
    if (e.key === "Home") { e.preventDefault(); goTo(0); }
    if (e.key === "End")  { e.preventDefault(); goTo(PAGE_COUNT - 1); }
  });

  function update(idx) {
    loadAround(idx);
    var portrait = flip.getOrientation() === "portrait";
    document.body.classList.toggle("portrait", portrait);
    showPosition(idx, portrait);
    prev.disabled = idx === 0;
    // keep a closed book centred, like a real one on a table
    wrap.classList.toggle("closed-front", !portrait && idx === 0);
    wrap.classList.toggle("closed-back", !portrait && idx >= PAGE_COUNT - 1);
    next.disabled = idx >= PAGE_COUNT - 1;
  }

  flip.on("flip", function (e) { update(e.data); });
  flip.on("changeState", function (e) {
    if (e.data === "flipping" || e.data === "user_fold") wrap.classList.remove("closed-front", "closed-back");
  });
  flip.on("changeOrientation", function () { update(flip.getCurrentPageIndex()); });
  update(0);

  prev.addEventListener("click", function () { flip.flipPrev(); });
  next.addEventListener("click", function () { flip.flipNext(); });
  document.addEventListener("keydown", function (e) {
    if (e.target.classList && e.target.classList.contains("zoom-range")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); flip.flipNext(); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); flip.flipPrev(); }
  });

  // ---- zoom + pan ----
  var viewport = document.querySelector(".viewport");
  var layer = document.querySelector(".zoomlayer");
  var pan = document.querySelector(".panlayer");
  var range = document.querySelector(".zoom-range");
  var zIn = document.querySelector(".zoom-in");
  var zOut = document.querySelector(".zoom-out");
  var Z_MIN = 1, Z_MAX = 3, Z_STEP = 0.5;
  var z = 1, tx = 0, ty = 0;

  function clampPan() {
    var mx = (z - 1) * viewport.offsetWidth / 2;
    var my = (z - 1) * viewport.offsetHeight / 2;
    tx = Math.max(-mx, Math.min(mx, tx));
    ty = Math.max(-my, Math.min(my, ty));
  }
  var unclip;
  function applyZoom(animate) {
    clampPan();
    layer.classList.toggle("instant", !animate);
    layer.style.transform = z === 1 ? "" : "translate(" + tx + "px," + ty + "px) scale(" + z + ")";
    clearTimeout(unclip);
    if (z > 1) viewport.classList.add("zoomed");
    // when zooming back out, keep the frame clipped until the glide finishes
    else if (animate) unclip = setTimeout(function () { viewport.classList.remove("zoomed"); }, 520);
    else viewport.classList.remove("zoomed");
    range.value = z;
    zOut.disabled = z <= Z_MIN;
    zIn.disabled = z >= Z_MAX;
  }
  function setZoom(nz, animate) {
    nz = Math.round(Math.max(Z_MIN, Math.min(Z_MAX, nz)) * 100) / 100;
    if (nz === 1) { tx = 0; ty = 0; }
    else { tx *= nz / z; ty *= nz / z; }   // keep the same spot centred
    z = nz;
    applyZoom(animate);
  }
  zIn.addEventListener("click", function () { setZoom(z + Z_STEP, true); });
  zOut.addEventListener("click", function () { setZoom(z - Z_STEP, true); });
  range.addEventListener("input", function () { setZoom(parseFloat(range.value)); });

  // drag to pan while zoomed (this layer also stops drags from turning pages)
  var panStart = null;
  pan.addEventListener("pointerdown", function (e) {
    panStart = { x: e.clientX, y: e.clientY, tx: tx, ty: ty };
    pan.setPointerCapture(e.pointerId);
    pan.classList.add("panning");
  });
  pan.addEventListener("pointermove", function (e) {
    if (!panStart) return;
    tx = panStart.tx + (e.clientX - panStart.x);
    ty = panStart.ty + (e.clientY - panStart.y);
    applyZoom();
  });
  function endPan() { panStart = null; pan.classList.remove("panning"); }
  pan.addEventListener("pointerup", endPan);
  pan.addEventListener("pointercancel", endPan);

  // trackpad pinch (and ctrl + scroll) zooms the book instead of the whole page;
  // plain scrolling pans when zoomed in
  viewport.addEventListener("wheel", function (e) {
    if (e.ctrlKey) {
      e.preventDefault();
      setZoom(z * Math.exp(-e.deltaY * 0.01));
    } else if (z > 1) {
      e.preventDefault();
      tx -= e.deltaX; ty -= e.deltaY;
      applyZoom();
    }
  }, { passive: false });

  document.addEventListener("keydown", function (e) {
    if (e.target === range) return;
    if (e.key === "+" || e.key === "=") { e.preventDefault(); setZoom(z + Z_STEP, true); }
    if (e.key === "-" || e.key === "_") { e.preventDefault(); setZoom(z - Z_STEP, true); }
    if (e.key === "Escape" || e.key === "0") { setZoom(1, true); }
  });

  // ---- full screen (hidden where the browser doesn't support it, e.g. iPhone Safari) ----
  var fsBtn = document.querySelector(".fs");
  var root = document.documentElement;
  var canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement; }
  if (canFs) {
    fsBtn.hidden = false;
    fsBtn.addEventListener("click", function () {
      if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    });
    function onFs() {
      var on = !!fsEl();
      document.body.classList.toggle("is-fullscreen", on);
      fsBtn.setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
    }
    document.addEventListener("fullscreenchange", onFs);
    document.addEventListener("webkitfullscreenchange", onFs);
  }
  document.addEventListener("keydown", function (e) {
    if ((e.key === "f" || e.key === "F") && canFs && !e.metaKey && !e.ctrlKey) fsBtn.click();
  });

  var t;
  window.addEventListener("resize", function () {
    clearTimeout(t);
    t = setTimeout(function () { fit(); flip.update(); update(flip.getCurrentPageIndex()); applyZoom(); }, 120);
  });
})();
</script>
